étapes ont lieu dans la même région"], [2], "Le Label Rouge porte sur une qualité supérieure par rapport aux produits similaires. Origine, bio et recette correspondent à d’autres garanties."], [0, "Agriculture biologique", "Un produit porte à la fois AB et la feuille européenne. Comment le compter dans les familles de signes ?", ["Deux origines géographiques différentes", "Une famille bio et une famille Label Rouge", "Une famille, l’agriculture biologique", "Deux spécialités traditionnelles"], [2], "Les deux logos peuvent identifier la même démarche biologique. Compter les dessins comme des familles surestime leur nombre."], [0, "STG", "Une recette est protégée par une STG. Quelle affirmation peux-tu soutenir ?", ["Le produit vient toujours de France", "Une composition ou méthode traditionnelle est reconnue", "Chaque étape a lieu dans un terroir unique", "Le produit est nécessairement issu de l’agriculture biologique"], [1], "La STG reconnaît une tradition. Pour annoncer une origine ou une méthode biologique, il faut un indice correspondant."], [0, "AOP et IGP", "Deux fromages affichent AOP et IGP. Quelle précision donne un conseil exact ?", ["Les deux signes garantissent une qualité supérieure Label Rouge", "L’AOP lie toutes les étapes au territoire, l’IGP en exige au moins une", "L’IGP exige toutes les étapes dans le territoire et l’AOP une seule", "Les deux signes protègent uniquement la recette"], [1], "Le lien géographique est central. Sa portée diffère entre AOP et IGP. L’AOC est la reconnaissance française liée à l’origine."], [0, "Part en pourcentage", "Dans un autre inventaire, 30 produits sur 120 portent un signe donné. Quelle part représente ce groupe ?", ["40 %", "25 %", "30 %", "75 %"], [1], "30 ÷ 120 × 100 = 25. Le nombre de produits devient un pourcentage seulement après division par le total."], [0, "Lecture d’un graphique", "Le plus grand secteur d’un graphique représente 37 % des références comptées. Quelle conclusion est justifiée ?", ["Elle représente la majorité absolue des références", "C’est la catégorie la plus représentée dans cet inventaire", "37 % des clients la choisissent", "Elle réalise 37 % du chiffre d’affaires"], [1], "37 % peut être la plus grande part sans dépasser la moitié. Le graphique compte des références, pas des achats ni des ventes."], [1, "Îlot de vente", "Le vendeur sert du fromage à la coupe depuis son poste central entouré de comptoirs. Quel mobilier reconnais-tu ?", ["Un meuble vrac", "Un meuble de devant de caisse", "Une bergerie", "Une gondole"], [2], "La disposition autour du vendeur et le service à la coupe caractérisent la bergerie. Repère qui prélève le produit."], [1, "Cagette", "Des pommes sont livrées en cagettes pour être choisies à l’unité. Où les présenter ?", ["Sur un meuble de devant de caisse", "Sur un présentoir à cagettes", "Dans un distributeur de vrac à gravité", "Dans une bergerie de coupe"], [1], "Le présentoir accueille les cagettes et rend chaque fruit accessible sans verser le lot dans un silo."], [1, "Distributeur de vrac", "Un client se sert des lentilles à la quantité souhaitée en ouvrant une trappe. Quel meuble est adapté ?", ["Un bac congélateur ouvert", "Un présentoir à cagettes", "Une gondole de sachets prêts à vendre", "Un meuble vrac avec silo"], [3], "Le silo distribue une quantité choisie de produits secs. Un sachet prérempli impose déjà la quantité."], [1, "Devant de caisse", "Où placer des chewing-gums destinés à un achat de dernière minute ?", ["Dans un bac congélateur promotionnel", "Sur le meuble de devant de caisse", "Sur un présentoir à cagettes en réserve", "Au centre d’une bergerie de service"], [1], "L’emplacement devant la caisse rend un petit article accessible au moment de payer. Le choix dépend aussi du parcours du client."], [1, "Bac congélateur", "Pour proposer des glaces en libre-service à −18 °C, quel équipement choisir ?", ["Une bergerie à +4 °C", "Un bac congélateur à la température indiquée", "Une gondole avec joues isolantes", "Une vitrine positive de desserts frais"], [1], "Un mobilier froid doit maintenir la température requise. Une vitrine réfrigérée positive ne conserve pas les glaces surgelées."], [1, "Facing", "Les bouteilles sont en retrait mais plusieurs unités restent au fond. Quel premier geste de présentation convient ?", ["Passer immédiatement une commande", "Transférer la référence vers une autre étiquette", "Avancer et aligner les unités à leur emplacement", "Élargir la référence voisine sur la place vide"], [2], "Le facing utilise les produits déjà présents. Il facilite le repérage et conserve la correspondance entre produit et prix."], [1, "Face de vente", "L’étiquette de marque d’une bouteille est tournée vers le fond. Quelle action aide le client ?", ["Masquer l’étiquette-prix pour libérer la vue", "Tourner toutes les bouteilles côté code-barres", "Orienter la face de vente vers l’allée", "Déplacer la bouteille devant le prix voisin"], [2], "Le client repère la variété et lit le prix quand la face de vente et l’étiquette de tablette correspondent."], [1, "Réassortiment", "Un emplacement est vide, mais un carton conforme de la même référence est disponible en réserve. Quel geste effectues-tu ?", ["Réassortir puis refaire la frontale", "Déclarer une rupture de stock du magasin", "Avancer uniquement la référence voisine", "Retirer l’étiquette de prix"], [0], "Le réassort apporte des unités disponibles. Le facing seul ne remplit pas un emplacement sans produit."], [1, "Rotation", "Deux lots de yaourts ont des dates différentes, toutes deux valides. Comment les disposer ?", ["Mélanger les deux lots pour uniformiser les couleurs", "Laisser les dates proches derrière le lot reçu", "Placer systématiquement le nouveau carton devant", "Placer les dates les plus proches devant"], [3], "La rotation rend d’abord accessibles les unités à vendre plus tôt. Un rayon bien aligné peut encore cacher une mauvaise rotation."], [1, "Effet de masse", "Un collègue veut produire un effet de masse sur une tablette déjà presque pleine. Que fais-tu ?", ["Bloquer la prise du premier produit pour stabiliser la pile", "Empiler au-delà de la butée de sécurité", "Répartir régulièrement dans la capacité prévue", "Utiliser l’emplacement voisin malgré son prix différent"], [2], "L’abondance visuelle repose sur une présentation régulière et accessible. Le mobilier et ses limites protègent le client."], [2, "Rupture en rayon", "À midi au rayon déjeuner, l’emplacement du sandwich poulet est vide. Que peux-tu affirmer immédiatement ?", ["Le fournisseur a livré en retard", "Aucun sandwich poulet n’est visible à l’emplacement observé", "Le poulet est la meilleure vente du jour", "La réserve est vide depuis ce matin"], [1], "Un emplacement vide est un constat localisé. Réserve, livraison et rythme des ventes doivent être contrôlés séparément."], [2, "Balisage prix", "Six wraps sont avancés sous le prix d’une salade. Quelle correction est prioritaire ?", ["Étendre les wraps sur les deux emplacements", "Masquer le prix le temps de vendre", "Rendre à chaque référence son emplacement et vérifier son prix", "Avancer les wraps sans changer leur emplacement"], [2], "La présentation doit permettre d’associer le bon article au bon prix. L’alignement seul ne corrige pas cette confusion."], [2, "Produit non marchand", "Une barquette fuit dans le meuble frais. Quelle action protège le client ?", ["La tourner pour rendre la fuite invisible", "Retirer la barquette de la vente, isoler et signaler selon la procédure", "La placer devant pour la vendre en premier", "La laisser jusqu’au passage suivant"], [1], "Une fuite touche l’intégrité du conditionnement. Écarter le produit et traiter la zone selon les consignes précède le facing."], [2, "Risque de rupture", "Il reste deux salades quinoa et six unités sont habituellement vendues avant 14 h. Quelle décision prend en compte le risque ?", ["Étaler les deux salades sur six emplacements", "Contrôler la réserve et préparer le réassort", "Attendre la dernière vente pour regarder en réserve", "Déclarer une rupture déjà certaine"], [1], "La disponibilité risque d’être insuffisante. La prévision renseigne un risque et le contrôle physique guide l’action."], [2, "Stock théorique", "Le stock informatique affiche cinq salades, tu n’en trouves aucune au rayon. Quelle suite est justifiée ?", ["Annoncer que cinq unités sont forcément disponibles", "Vérifier les emplacements et la réserve, puis signaler l’écart éventuel", "Corriger le stock à zéro d’après la tablette seule", "Recouvrir l’étiquette avec une variété proche"], [1], "Le stock enregistré et la présence réelle se vérifient. Chercher la bonne référence évite une correction injustifiée."], [2, "Lisibilité du rayon", "Les yaourts à boire sont au fond et leurs noms sont cachés. Quel effet client peux-tu expliquer ?", ["La marge de la référence a déjà diminué", "Le client peut croire la référence indisponible", "Le produit a forcément dépassé sa date", "La température a nécessairement augmenté"], [1], "Le retrait et la face cachée affectent la visibilité. Date, froid et marge demandent d’autres contrôles."], [2, "Rotation", "Un lot conforme arrive pendant le réassort. Les unités déjà présentes expirent plus tôt. Que fais-tu ?", ["Garder les dates proches accessibles devant", "Ranger les deux lots sans lire leurs dates", "Installer le nouveau lot devant pour aller plus vite", "Choisir l’ordre selon la couleur de l’emballage"], [0], "Les dates orientent la rotation des produits frais. Une livraison récente ne détermine pas à elle seule l’ordre d’exposition."], [2, "Compte rendu", "Mathieu signale une baisse des ventes. Quelle phrase convient dans le courriel ?", ["Le fournisseur est responsable de toute la baisse.", "J’ai observé deux emplacements vides à midi. Vérifions leur durée et les ventes.", "Les clients ne veulent plus de salades puisque la tablette est vide.", "La baisse vient sûrement du prix, inutile de vérifier le rayon."], [1], "Le message précise ce qui est visible et propose un contrôle. Une photo seule ne prouve pas une cause commerciale."], [2, "Transmission", "Le carton de remplacement n’arrivera que demain. Quelle information transmettre ?", ["Le nombre de faces sans indiquer la référence", "Le chiffre d’affaires total du magasin sans le constat", "Seulement le nom de la famille de produits", "La référence, la quantité constatée et le prochain approvisionnement connu"], [3], "Une alerte exploitable situe le manque et son horizon. Le responsable peut décider et informer l’équipe."], [2, "Contrôle de l’état marchand", "Après intervention, que vérifies-tu avant de quitter le rayon déjeuner ?", ["Uniquement la symétrie des emballages", "Références, prix, dates, alignement et manques encore à signaler", "Uniquement le nombre total de cartons vides", "Uniquement le chiffre d’affaires de la veille"], [1], "Le dernier passage relie présentation, conformité et disponibilité. Une belle frontale ne garantit pas le réassort."], [0, "Chaîne du froid", "Quels mots-clés permettent de définir la chaîne du froid entre réserve et rayon ?", ["température adaptée au produit", "simple contrôle visuel de l’emballage", "maintien à chaque étape", "contrôle seulement à la réception"], [0, 2], "Chaque étape doit préserver les conditions de température du produit."], [0, "AOP ou IGP", "Quels indices distinguent une AOP d’une IGP ?", ["AOP · toutes les étapes dans l’aire définie", "IGP · aucune étape locale exigée", "AOP · recette traditionnelle seule", "IGP · au moins une étape dans l’aire définie"], [0, 3], "Les deux signes relient le produit à un lieu. Le nombre d’étapes devant s’y dérouler les distingue."], [0, "STG", "Quelle formulation permet d’expliquer la STG à un client ?", ["origine et aire unique · toutes les étapes locales", "recette ou méthode traditionnelle · savoir-faire", "agriculture biologique · logo européen", "qualité supérieure · comparaison avec les produits courants"], [1], "Une spécialité traditionnelle garantie valorise une recette ou un mode de production traditionnel."], [0, "Label Rouge", "Quels mots-clés décrivent le Label Rouge ?", ["origine locale · même commune", "mode biologique · origine locale", "cahier des charges · qualité supérieure", "recette ancienne · origine obligatoire"], [2], "Le Label Rouge atteste un niveau de qualité supérieure selon un cahier des charges."], [1, "Facing", "Pour définir le facing, quelles actions associer ?", ["avancer les unités déjà présentes", "changer la référence pour masquer un vide", "orienter les faces de vente vers le client", "modifier le stock informatique"], [0, 2], "Le facing rend les références présentes visibles et alignées en façade."], [1, "Réassortiment", "Des paquets manquent en rayon, le carton correspondant est en réserve. Quels mots-clés décrivent le geste ?", ["étiqueter · baisser le prix", "déstocker · changer de référence", "avancer · laisser le carton en réserve", "vérifier la référence · prélever · réapprovisionner le rayon"], [3], "Réassortir consiste à compléter la quantité disponible en rayon avec les bons produits."], [1, "Rotation", "Deux lots conformes restent à vendre. Quels gestes permettent une rotation par date ?", ["placer le lot reçu ce matin devant dans tous les cas", "comparer les dates limites des deux lots", "mettre en avant l’échéance la plus proche", "classer uniquement par taille d’emballage"], [1, 2], "Comparer les échéances permet de rendre le lot à vendre en premier accessible au client."], [1, "Mobilier en vrac", "Quels mots différencient un distributeur de vrac d’une gondole de sachets ?", ["quantité choisie · produit délivré à la demande", "paquet fermé · unité prédéfinie", "facing · vente à la pièce préemballée", "tablette inclinée · prix à l’unité"], [0], "En vrac, le client choisit sa quantité. Le type de meuble doit permettre ce service."], [2, "Rupture en rayon", "L’emplacement est vide. Quelles affirmations peut-on soutenir avant un contrôle en réserve ?", ["absence au rayon constatée", "rupture de stock total prouvée", "stock informatique nécessairement faux", "disponibilité en réserve à vérifier"], [0, 3], "Le constat en surface de vente ne suffit pas à conclure sur le stock total."], [2, "Balisage prix", "Une étiquette est lisible sous le mauvais produit. Quels mots permettent de décider ?", ["lisibilité seule · rayon conforme", "référence exacte · emplacement · concordance du prix", "couleur de l’emballage · proximité", "prix voisin · même famille · équivalence"], [1], "Le prix doit correspondre à la référence et à son emplacement, même lorsqu’il est bien lisible."], [2, "État marchand", "Après le réassort du rayon déjeuner, quels contrôles concernent directement son état marchand ?", ["quantité accessible et présentation visible", "nombre total de salariés présents", "conformité des produits, des dates et du balisage", "volume de la prochaine livraison uniquement"], [0, 2], "Le contrôle associe disponibilité, présentation, conformité et bonne information du client."], [2, "Transmission", "Quel enchaînement permet à Mathieu de reprendre ton diagnostic ?", ["avis personnel · jugement global", "quantité approximative · action supposée", "demande générale · cause certaine", "référence et lieu · fait observé · action réalisée ou à suivre"], [3], "Une transmission professionnelle distingue le constat vérifié et les actions à suivre."]];const formCards=["<article class=\"formcard\"><div><p class=\"ey\">Chaîne du froid · labels · origine et qualité</p><h2>Conserver et reconnaître les signes de qualité</h2><a class=\"btn primary\" href=\"https://docs.google.com/forms/d/e/1FAIpQLSe5g7Ui2mZlGoxYesDzmEsRLPre2N4bBmlXOqM4cuAA78Skrw/viewform\" target=\"_blank\" rel=\"noopener\">Ouvrir le Google Form ↗</a></div><img src=\"data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPCFET0NUWVBFIHN2ZwogIFBVQkxJQyAnLS8vVzNDLy9EVEQgU1ZHIDEuMC8vRU4nCiAgJ2h0dHA6Ly93d3cudzMub3JnL1RSLzIwMDEvUkVDLVNWRy0yMDAxMDkwNC9EVEQvc3ZnMTAuZHRkJ function balancedTeams(roster,count){

 if(count<2||count>present.length)throw new Error('Prévoyez au moins un élève présent par équipe.');
 const seats=shuffled(Array.from({length:count},(_,i)=>i)), groups=seats.map(()=>[]);let cursor=0;
 for(const category of shuffled(['F','G','?'])){

 }
 return groups.map(shuffled)
}

function startGame(){
 if(game.source==='newTeams'&&!game.groups&&!spinTeams())return;
 for(let i=0;i<game.count;i++)cleanTeamName(i);
 const pool=eligible();
 if(game.part===-1){
  const piles=gameParts.map((_,j)=>shuffled(pool.filter(i=>rounds[i][0]===j)));
  const order=shuffled([0,1,2]);
  game.deck=Array.from({length:game.length},(_,i)=>piles[order[i%3]].pop());
  game.deck=shuffled(game.deck);
 }else game.deck=shuffled(pool).slice(0,game.length);
 game.scores=Array(game.count).fill(0);game.round=0;game.phase='play';game.history=[];prepareRound();
}
function prepareRound(){
 game.revealed=false;game.ballots=Array.from({length:game.count},()=>({picks:[],locked:false}));paintGame();
}
function togglePick(t,i){
 const b=game.ballots[t],keys=rounds[game.deck[game.round]][4];
 if(b.locked||game.revealed)return;
 if(keys.length===1)b.picks=[i];
 else if(b.picks.includes(i))b.picks=b.picks.filter(v=>v!==i);
 else if(b.picks.length<keys.length)b.picks.push(i);
 paintGame();
}
function lockVote(t,pass=false){
 if(game.revealed)return;
 const b=game.ballots[t];if(b.locked)return;
 if(pass)b.picks=[];
 else if(b.picks.length!==rounds[game.deck[game.round]][4].length)return;
 b.locked=true;paintGame();
}
function revealRound(){
 if(game.revealed||!game.ballots.every(b=>b.locked))return;
 const keys=rounds[game.deck[game.round]][4];
 const marks=game.ballots.map(b=>Number(b.picks.length===keys.length&&keys.every(k=>b.picks.includes(k))));
 game.history.push({question:game.deck[game.round],answers:game.ballots.map(b=>b.picks.slice()),marks});
 game.scores=game.scores.map((v,i)=>v+marks[i]);game.revealed=true;paintGame();
}
const answerLetters=picks=>picks.length?[...picks].sort().map(i=>L[i]).join(' + '):'Passe';
function playView(){
 const [part,term,q,opts,keys,why]=rounds[game.deck[game.round]];
 const labels='<div class="grid choices">'+opts.map((o,i)=>'<div class="option-key '+(game.revealed&&keys.includes(i)?'correct':'')+'"><b>'+L[i]+'</b> '+esc(o)+'</div>').join('')+'</div>';
 const teamRows=game.ballots.map((b,t)=>{
  let controls='';
  if(!game.revealed && !b.locked){
   controls='<div class="ballot">'+opts.map((_,i)=>'<button type="button" aria-label="'+esc(game.names[t])+' · '+L[i]+'" aria-pressed="'+b.picks.includes(i)+'" onclick="togglePick('+t+','+i+')">'+L[i]+'</button>').join('')+'</div><div class="actions"><button '+(b.picks.length===keys.length?'':'disabled')+' onclick="lockVote('+t+')">Figer</button>'+B('Passe','lockVote('+t+',true)')+'</div>';
  }else if(!game.revealed) controls=B('Modifier','game.ballots['+t+'].locked=false;paintGame()');
  const mark=game.revealed?(game.history.at(-1).marks[t]?' · +1 point':' · +0'):'';
  return '<article><b>'+esc(game.names[t])+'</b><small>'+game.scores[t]+' pt · '+(b.locked?'Réponse figée':'À saisir')+'</small><strong>'+(b.picks.length||b.locked?answerLetters(b.picks):'…')+mark+'</strong>'+controls+'</article>';
 }).join('');
 let footer;
 if(game.revealed){
  footer=box('Réponse '+answerLetters(keys)+' · '+esc(term),esc(why))+'<div class="actions">'+(game.round+1<game.deck.length?B('Question suivante','game.round++;prepareRound()','primary'):'')+(game.history.length>=6?B('Afficher le classement',"game.phase='end';paintGame()",'primary'):'')+'</div>';
 }else footer='<button class="primary" '+(game.ballots.every(b=>b.locked)?'':'disabled')+' onclick="revealRound()">Révéler et compter les points</button>';
 return '<div class="ey">Question '+(game.round+1)+' / '+game.deck.length+' · '+gameParts[part]+'</div><h2>'+esc(q)+'</h2><p>'+keys.length+' choix par équipe. Faites justifier la réponse à l’oral, puis figez-la.</p>'+labels+'<div class="gx-cards">'+teamRows+'</div>'+footer;
}
function endView(){
 const ranking=game.names.slice(0,game.count).map((name,i)=>({name,score:game.scores[i]})).sort((a,b)=>b.score-a.score);
 return '<h2>Classement final</h2><div class="gx-cards">'+ranking.map(({name,score})=>'<article><small>Rang '+(1+ranking.filter(r=>r.score>score).length)+'</small><b>'+esc(name)+'</b><strong>'+score+' / '+game.history.length+'</strong></article>').join('')+'</div>'+
 B('Passer au Google Form individuel','showForms(true)','primary')+
 details('Revoir les réponses des équipes',game.history.map((h,j)=>'<h3>'+ (j+1)+'. '+esc(rounds[h.question][2])+'</h3>'+para('Réponse attendue · '+answerLetters(rounds[h.question][4]))+h.answers.map((a,t)=>para(game.names[t]+' · '+answerLetters(a)+' · +'+h.marks[t])).join('')).join(''))+B('Préparer une nouvelle partie',"game.phase='setup';paintGame()");
}
const gameCache='2epc-franprix-exit-v1';
function paintGame(){
 zone.innerHTML=game.phase==='setup'?setupGame():game.phase==='play'?playView():endView();
 try{
  if(game.phase==='setup')sessionStorage.removeItem(gameCache);
  else {const {phase,deck,round,count,names,scores,history,ballots,revealed,source,part,length}=game;
   sessionStorage.setItem(gameCache,JSON.stringify({phase,deck,round,count,names:names.slice(),scores,history,ballots,revealed,source,part,length}));}
 }catch{}
}
try{
 const g=JSON.parse(sessionStorage.getItem(gameCache));
 if(g&&['play','end'].includes(g.phase)&&Array.isArray(g.deck)&&g.deck.every(i=>rounds[i])&&g.deck[g.round]!=null&&g.ballots?.length===g.count&&g.history?.length<=g.deck.length)Object.assign(game,g);
}catch{}

let formsOpen=false;
function showForms(targeted){formsOpen=true;zone.innerHTML='<div class="ey">Validation individuelle</div><h1>Google Forms</h1>'+((targeted&&game.part>=0)?formCards[game.part]:formCards.join(''))+B('Revenir au jeu','formsOpen=false;paintGame()');window.scrollTo(0,0);}
if(new URLSearchParams(location.search).has('forms'))showForms(false);else paintGame();
</script><script src="chrono-franprix.js"></script></body></html>
